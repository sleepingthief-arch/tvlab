<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV LAB">
<meta name="theme-color" content="#1c1c1c">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>TV LAB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --bg:#1c1c1c;--card:#2c2c2c;--card2:#3c3c3c;--card3:#4a4a4a;
  --accent:#ff6b35;--accent2:#ffd166;--green:#66bb6a;--red:#ff3d57;
  --yellow:#ffd166;--purple:#b47aff;
  --text:#f0f0f0;--text2:#aaaaaa;--text3:#666666;--border:#444444;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;}

/* 헤더 */
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px 10px;position:sticky;top:0;z-index:100;}
.hdr-search-wrap{padding:6px 0 2px;}
.hr1{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.logo-area{display:flex;align-items:center;gap:8px;}
.logo{font-size:17px;font-weight:900;letter-spacing:3px;color:var(--accent);}
.sync{font-size:13px;cursor:help;}
.mbtns{display:flex;gap:6px;}
.mb{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text2);transition:.2s;}
.mb.on{background:var(--accent);color:#000;border-color:var(--accent);}
.drow{display:flex;gap:6px;align-items:center;}
.darr{background:var(--card2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dinp{flex:1;background:var(--card2);border:1px solid var(--accent);color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px;font-family:inherit;text-align:center;}
.tbtn{background:var(--card2);border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0;}

/* 뷰 탭 */
.vtabs{display:flex;gap:6px;padding:10px 16px 0;}
.vt{flex:1;padding:7px;border-radius:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text2);transition:.2s;}
.vt.on{background:#ff6b35;color:#fff;border-color:#c0606a;}

/* 검색 */
.search-wrap{padding:8px 16px 0;position:relative;}
.search-inp{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:9px 36px 9px 34px;border-radius:10px;font-size:13px;font-family:inherit;}
.search-inp:focus{outline:none;border-color:#ff6b35;}
.search-inp::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:26px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text2);}
.search-x{position:absolute;right:26px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;}

/* 요약 (대표만) */
.sum-area{padding:10px 16px 0;}
.sum-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
.sum-card{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;}
.sum-card.r{border:1px solid rgba(0,212,255,.4);}
.sum-card.c{border:1px solid rgba(255,107,53,.4);}
.sum-card.m{border:1px solid rgba(0,232,122,.4);}
.sum-lbl{font-size:10px;color:var(--text2);margin-bottom:3px;}
.sum-val{font-size:17px;font-weight:700;}
.sum-val.r{color:var(--accent);}.sum-val.c{color:var(--accent2);}.sum-val.m{color:var(--green);}
.sum-unit{font-size:9px;color:var(--text3);margin-top:1px;}
.rate-row{display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;}
.rate-bar{background:var(--card2);border-radius:99px;height:5px;overflow:hidden;margin-bottom:10px;}
.rate-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ff6b35,#ffd166);transition:width .5s;}

/* 권한 */
body.staff .boss-only{display:none!important;}
body.staff .write-only{display:none!important;}

/* PIN */
.pin-ov{display:none;position:fixed;inset:0;background:rgba(10,10,10,.97);z-index:500;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.pin-ov.show{display:flex;}
.pdots{display:flex;gap:12px;}
.pdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--text3);transition:.2s;}
.pdot.on{background:var(--accent);border-color:var(--accent);}
.ppad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:210px;}
.pkey{background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:20px;font-weight:700;border-radius:12px;padding:14px;cursor:pointer;font-family:inherit;text-align:center;}
.pkey:active{background:#ff6b35;color:#fff;}
.perr{color:var(--red);font-size:12px;min-height:18px;}

/* 일별 */
.day-wrap{padding:10px 16px 0;}
.addbtn{width:100%;background:#ff6b35;color:#fff;border:none;padding:13px;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:12px;}
.day-hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2);font-weight:700;margin-bottom:10px;}

/* 시공 카드 */
.jcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;}
.jcard.done{border-left:3px solid #66bb6a;}
.jcard.paid{border-left:3px solid #ffd166;}
.jcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.jcard-info{flex:1;cursor:pointer;}
.jcard-title{font-size:14px;font-weight:700;line-height:1.4;color:var(--accent);}
.jcard.done .jcard-title{color:var(--text);}
.jcard-time{font-size:11px;color:var(--text2);margin-top:2px;}
.jcard-hint{font-size:10px;color:var(--text3);margin-top:2px;}
.jdel{background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;padding:0 2px;line-height:1;}
.jstatus{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px;margin-bottom:8px;}
.jstatus.sched{background:rgba(180,122,255,.2);color:var(--purple);}
.jstatus.done{background:rgba(0,232,122,.2);color:var(--green);}
.jstatus.paid{background:rgba(0,212,255,.2);color:var(--accent);}

/* 동호수 인라인 입력 */
.dong-inp{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--yellow);padding:4px 2px;font-size:12px;font-weight:700;font-family:inherit;margin-bottom:8px;}
.dong-inp:focus{outline:none;border-bottom-color:var(--yellow);}
.dong-inp::placeholder{color:var(--text3);font-weight:400;}

/* 매출/원가/마진 */
.rev-box{text-align:center;margin-bottom:8px;}
.rev-lbl{font-size:10px;color:var(--text2);}
.rev-val{font-size:22px;font-weight:700;color:var(--accent);}
.cost-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.cost-item{text-align:center;}
.cost-lbl{font-size:9px;color:var(--text2);margin-bottom:1px;}
.cost-val{font-size:13px;font-weight:700;}
.cost-val.c{color:var(--accent2);}.cost-val.m{color:var(--green);}

.jitems{font-size:11px;color:var(--text2);line-height:1.7;margin-bottom:8px;}
.jmemo-orig{font-size:11px;color:var(--text3);line-height:1.6;background:var(--card2);border-radius:6px;padding:7px 9px;margin-bottom:8px;white-space:pre-wrap;}
.jmemo{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:12px;font-family:inherit;resize:vertical;min-height:110px;line-height:1.7;margin-bottom:8px;overflow-y:auto;}
.jmemo:focus{outline:none;border-color:var(--accent);}
body.staff .jmemo{pointer-events:none;opacity:.5;}

/* 버튼들 */
.jbtns{display:grid;gap:6px;margin-bottom:6px;}
.jbtns.g3{grid-template-columns:2fr 1fr 1fr;}
.jbtns.g2{grid-template-columns:1fr 1fr;}
.jb{border:none;padding:9px 5px;border-radius:8px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;}
.jb.complete{background:rgba(0,232,122,.25);color:var(--green);border:1px solid var(--green);}
.jb.call{background:rgba(0,232,122,.1);color:var(--green);border:1px solid rgba(0,232,122,.25);}
.jb.msg{background:rgba(0,212,255,.1);color:var(--accent);border:1px solid rgba(0,212,255,.25);}
.jb.billing{background:rgba(255,107,53,.15);color:var(--accent2);border:1px solid rgba(255,107,53,.3);}
.jb.undo{background:rgba(255,209,102,.1);color:var(--yellow);border:1px solid rgba(255,209,102,.25);}
.paid-row{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:8px;padding:10px 12px;cursor:pointer;margin-top:4px;}
.paid-box{width:20px;height:20px;border-radius:4px;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center;font-size:12px;transition:.2s;flex-shrink:0;}
.paid-box.on{background:var(--accent);border-color:var(--accent);}
.paid-lbl{font-size:13px;color:var(--text2);}

/* 빈상태 */
.empty{text-align:center;padding:48px 20px;color:var(--text2);}
.empty-icon{font-size:40px;margin-bottom:12px;}

/* 월별 캘린더 */
.cal-wrap{padding:0;display:flex;flex-direction:column;height:calc(100vh - 170px);}
.cal-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0 10px;}
.cal-month{font-size:17px;font-weight:700;}
.cal-nb{background:var(--card2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-grid-wrap{flex:1;padding:0 4px 4px;overflow:hidden;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:2px;height:100%;}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);padding:0 4px;}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--text2);padding:4px 0;}
.cal-cell{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 4px 2px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;}
.cal-cell.today{border-color:#ff6b35;background:rgba(255,107,53,.08);}
.cal-cell.sel{border-color:var(--yellow);background:rgba(255,209,102,.05);}
.cal-cell.other{opacity:.3;}
.cal-cell.has{border-color:rgba(0,232,122,.25);}
.cal-dn{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:2px;flex-shrink:0;}
.cal-cell.today .cal-dn{background:var(--accent);color:#000;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;}
.cal-chips{display:flex;flex-direction:column;gap:2px;flex:1;overflow:hidden;}
.cal-chip{font-size:10px;padding:2px 4px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.4;font-weight:500;}
.cal-chip.s{background:rgba(100,160,255,.2);color:#80b0ff;}
.cal-chip.d{background:rgba(102,187,106,.2);color:#66bb6a;}
.cal-more{font-size:9px;color:var(--text3);padding:1px 2px;}

/* 검색 결과 */
.search-res{padding:0 16px;}
.search-res-hd{font-size:12px;color:var(--accent);font-weight:700;padding:8px 0 6px;}

/* 오버레이 */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;overflow-y:auto;padding:20px 16px 40px;}
.ov.show{display:block;}
.modal{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--border);max-width:480px;margin:0 auto;}
.mhd{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;color:var(--accent);margin-bottom:14px;}
.mclose{background:none;border:none;color:var(--text2);font-size:24px;cursor:pointer;line-height:1;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;}
.fi{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;font-family:inherit;}
.fi:focus{outline:none;border-color:#ff6b35;}

/* 시간 슬롯 */
.tslots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;}
.tslot{background:var(--card2);border:1px solid var(--border);color:var(--text2);padding:7px;border-radius:8px;font-size:11px;text-align:center;cursor:pointer;font-family:inherit;}
.tslot.on{background:rgba(255,107,53,.15);border-color:#ff6b35;color:#ff6b35;}

/* 칩 */
.clbl{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px;margin:12px 0 6px;}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.chip{background:var(--card2);border:1px solid var(--border);color:var(--text2);padding:7px 5px;border-radius:8px;font-size:11px;text-align:center;cursor:pointer;font-family:inherit;line-height:1.4;transition:.15s;}
.chip.on{background:rgba(255,107,53,.15);border-color:#ff6b35;color:#ff6b35;}
.chip-sub{font-size:9px;margin-top:2px;}

/* 선택 항목 (금액 수정) */
.sel-row{display:flex;align-items:center;background:var(--card2);border-radius:8px;padding:8px 10px;margin-bottom:5px;gap:8px;}
.sel-name{flex:1;font-size:12px;}
.sel-inp{width:68px;background:var(--card);border:1px solid var(--border);color:var(--accent);padding:5px 8px;border-radius:6px;font-size:13px;font-weight:700;font-family:inherit;text-align:right;}
.sel-inp:focus{outline:none;border-color:var(--accent);}
.sel-unit{font-size:11px;color:var(--text2);}
.sel-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;}

/* 할인 */
.dbox{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:12px;}
.dbox-title{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:8px;}
.drow{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.dlbl{font-size:12px;color:var(--text2);}
.dinp{width:68px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:6px;font-size:13px;font-family:inherit;text-align:right;}
.dinp:focus{outline:none;border-color:var(--accent);}

/* 미리보기 */
.pv{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid var(--border);}
.pvrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.pvrow.tot{border-top:1px solid var(--border);padding-top:8px;margin-top:4px;font-size:15px;font-weight:700;}
.pvl{color:var(--text2);}
.pv-r{color:var(--accent);}.pv-c{color:var(--accent2);}.pv-m{color:var(--green);}

.savebtn{width:100%;background:#ff6b35;color:#fff;border:none;padding:13px;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:6px;}
.dong-savebtn{width:100%;background:linear-gradient(135deg,#ffd166,#e6a800);color:#000;border:none;padding:12px;border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}

/* SMS 모달 */
.sms-txt{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--text);margin-bottom:12px;min-height:120px;}
.sms-send{width:100%;background:#c0606a;color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:8px;}
.copy-btn{width:100%;background:var(--card3);color:var(--text);border:1px solid var(--border);padding:11px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;}

/* 뷰 전환 애니메이션 */
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeSlideOut{
  from{opacity:1;transform:translateY(0);}
  to{opacity:0;transform:translateY(-8px);}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.97);}
  to{opacity:1;transform:scale(1);}
}
.view-enter{animation:fadeSlideIn .25s ease forwards;}
.view-exit{animation:fadeSlideOut .2s ease forwards;}

/* 모달 슬라이드 업 */
@keyframes modalUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes modalDown{
  from{opacity:1;transform:translateY(0);}
  to{opacity:0;transform:translateY(30px);}
}
.ov.show .modal{animation:modalUp .25s ease forwards;}

/* 카드 등장 */
@keyframes cardIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.jcard{animation:cardIn .2s ease forwards;}

/* 설정 페이지 */
.settings-btn{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:0 4px;}
.settings-wrap{display:none;padding:0 16px 16px;}
.settings-wrap.show{display:block;animation:fadeSlideIn .25s ease forwards;}
.settings-section{margin-bottom:20px;}
.settings-title{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.item-row{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;gap:8px;}
.item-name-inp{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;font-family:inherit;min-width:0;}
.item-name-inp:focus{outline:none;}
.item-price-inp{width:55px;background:var(--card2);border:1px solid var(--border);color:var(--accent);padding:4px 6px;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;text-align:right;}
.item-price-inp:focus{outline:none;border-color:var(--accent);}
.item-cost-inp{width:55px;background:var(--card2);border:1px solid var(--border);color:var(--accent2);padding:4px 6px;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;text-align:right;}
.item-cost-inp:focus{outline:none;border-color:var(--accent2);}
.item-lbl{font-size:9px;color:var(--text3);text-align:center;line-height:1.3;}
.item-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;flex-shrink:0;}
.add-item-btn{width:100%;background:var(--card2);border:1px dashed var(--border);color:var(--text2);padding:10px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;margin-top:4px;}
.settings-save-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;}
.settings-reset-btn{width:100%;background:none;border:1px solid var(--border);color:var(--text2);padding:10px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;margin-top:6px;}
.price-col{display:flex;flex-direction:column;align-items:center;gap:2px;}

/* 스와이프 애니메이션 */
@keyframes slideInRight{from{opacity:0;transform:translateX(60px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-60px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideOutLeft{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(-60px);}}
@keyframes slideOutRight{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(60px);}}
.slide-in-right{animation:slideInRight .25s ease forwards;}
.slide-in-left{animation:slideInLeft .25s ease forwards;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#c0606a;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
#colorSelectPop button:active{background:var(--card3) !important;}

/* 카드 접기/펼치기 */
.jcard-body{overflow:hidden;transition:max-height .3s ease;}
.jcard-body.collapsed{max-height:0;}
.jcard-body.expanded{max-height:2000px;}
.jcard-mini{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0;}
.jcard-mini-title{font-size:14px;font-weight:700;flex:1;line-height:1.3;}

.expand-arrow{font-size:12px;color:var(--text3);margin-left:6px;transition:transform .3s;}
.jcard-body.expanded ~ .jcard-mini .expand-arrow,
.expanded-arrow{transform:rotate(180deg);}

.color-picker{display:flex;gap:6px;margin:6px 0 2px;}
.color-dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;flex-shrink:0;}
.color-dot.selected{border-color:#fff;transform:scale(1.2);}

function fetchWeather() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    // 기온 가져오기
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current_weather=true&timezone=Asia%2FSeoul`)
      .then(r => r.json())
      .then(data => {
        const temp = data.current_weather?.temperature;
        const el = document.getElementById('weatherEl');
        if (el && temp !== undefined) {
          el.textContent = `${Math.round(temp)}°C`;
        }
      })
      .catch(() => {});

    // 동네명 가져오기 (카카오 역지오코딩 - 무료)
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ko`)
      .then(r => r.json())
      .then(data => {
        const addr = data.address;
        // 동/읍/면 우선, 없으면 구/군
        // 동/읍 우선, 없으면 구/군
        let dong = addr.suburb || addr.quarter || addr.neighbourhood
                 || addr.village || addr.town || '';
        // "신도시", "지구", "단지", "택지" 등 불필요한 접미사 제거
        dong = dong.replace(/(신도시|지구|단지|택지|도시|아파트|센터|마을).*$/, '').trim();
        const el = document.getElementById('locationEl');
        if (el && dong) {
          el.textContent = dong;
        }
      })
      .catch(() => {});

  }, () => {
    // 위치 거부 시 조용히 실패
  }, { timeout: 8000, enableHighAccuracy: false });
}

function subscribeFB(dateStr) {
  if (!db) return;
  if (unsubFn) unsubFn();
  unsubFn = db.collection('schedules').doc(dateStr).onSnapshot(doc => {
    const data = doc.exists ? doc.data() : {};
    const cloudStr = JSON.stringify(data);
    const localStr = localStorage.getItem('tvl_' + dateStr) || '{}';
    if (cloudStr !== localStr) {
      localStorage.setItem('tvl_' + dateStr, cloudStr);
      if (!isSaving) {
        // 새 데이터 있음 - 플래그 세팅 + 아이콘 표시
        hasNewData = true;
        showSync('🔄');
      }
    } else {
      showSync('🟢');
    }
  }, err => { showSync('🔴'); });
}

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function moveDate(n) {
  refreshIfNeeded();
  const d = new Date(curDate + 'T00:00:00');
  d.setDate(d.getDate() + n);
  const el = document.getElementById('viewDay');
  if (el && curView === 'day') {
    // 나가는 애니메이션
    el.style.animation = n > 0 ? 'slideOutLeft .15s ease forwards' : 'slideOutRight .15s ease forwards';
    setTimeout(() => {
      setDate(fmtDate(d));
      el.style.animation = '';
      el.classList.remove('slide-in-right','slide-in-left');
      void el.offsetWidth;
      el.classList.add(n > 0 ? 'slide-in-right' : 'slide-in-left');
    }, 150);
  } else {
    setDate(fmtDate(d));
  }
}

// 스와이프 감지
let swipeStartX = 0;
let swipeStartY = 0;
let swipeStartTime = 0;

function initSwipe() {
  // document 전체에서 스와이프 감지 (빈 공간 포함)
  document.addEventListener('touchstart', e => {
    // 모달/오버레이 열려있으면 무시
    const ovOpen = document.querySelector('.ov.show');
    if (ovOpen) return;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeStartTime = Date.now();
  }, { passive: true });

  document.addEventListener('touchend', e => {
    // 일별 뷰가 아니면 무시
    if (curView !== 'day') return;
    // 모달 열려있으면 무시
    const ovOpen = document.querySelector('.ov.show');
    if (ovOpen) return;

    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;
    const dt = Date.now() - swipeStartTime;

    if (Math.abs(dx) > 50 && Math.abs(dy) < 80 && dt < 400) {
      if (dx < 0) moveDate(1);   // 왼쪽 → 다음날
      else moveDate(-1);          // 오른쪽 → 전날
    }
  }, { passive: true });
}

// getAllItems: BASE + 사용자 추가 합치기
// ════════════════════════════════════════════
function getAllItems() {
  const base = BASE[curDate] || [];
  const result = [];
  base.forEach((s, i) => {
    const id = 'b_' + i;
    const sv = jobs[id] || {};
    if (sv.deleted) return;
    result.push({
      id, isBase: true,
      title: s.title,
      dong: sv.dong !== undefined ? sv.dong : (s.dong || ''),
      phone: sv.phone || s.phone || '',
      time: sv.time || s.time || '',
      memo: sv.memo !== undefined ? sv.memo : (s.memo || ''),
      userMemo: sv.userMemo || '',
      status: sv.status || 'sched',
      items: sv.items || [],
      revenue: sv.revenue || 0,
      cost: sv.cost || 0,
      margin: sv.margin || 0,
      discounts: sv.discounts || {},
      paid: sv.paid || false,
      cardColor: sv.cardColor || '',
      expanded: expandedState['b_'+i] || false,
    });
  });
  // 사용자 추가 일정
  Object.values(jobs).filter(j => j.id && !j.id.startsWith('b_') && !j.deleted)
    .forEach(j => result.push({ ...j, isBase: false }));
  return result.sort((a, b) => (a.time || '') > (b.time || '') ? 1 : -1);
}

// ════════════════════════════════════════════
// 일별 렌더
// ════════════════════════════════════════════
function renderDay() {
  const all = getAllItems();
  document.getElementById('dayCnt').textContent = all.length;
  const doneN = all.filter(j => j.status === 'done' || j.status === 'paid').length;
  document.getElementById('doneCnt').textContent = doneN > 0 ? `완료 ${doneN}건` : '';
  // 날짜 레이블 업데이트
  const dayLbl = document.getElementById('dayDateLbl');
  if (dayLbl && curDate) {
    const d = new Date(curDate + 'T00:00:00');
    const today = new Date();
    const isToday = curDate === fmtDate(today);
    const mm = d.getMonth() + 1;
    const dd = d.getDate();
    const days = ['일','월','화','수','목','금','토'];
    const dayStr = days[d.getDay()];
    dayLbl.textContent = isToday ? `오늘(${mm}/${dd})` : `${mm}/${dd}(${dayStr})`;
  }
  const list = document.getElementById('dayList');
  if (!all.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>일정이나 시공을 추가해보세요</div>`;
    return;
  }
  list.innerHTML = all.map(j => cardHTML(j)).join('');
}

function cardHTML(j) {
  const isDone = j.status === 'done' || j.status === 'paid';
  const isPaid = j.status === 'paid';
  const statusIcon = isPaid ? '💳' : isDone ? '✅' : '📅';
  const statusCls = isPaid ? 'paid' : isDone ? 'done' : 'sched';
  const cardCls = isPaid ? 'paid' : isDone ? 'done' : '';
  const hasJob = j.revenue > 0;
  const itemsTxt = (j.items || []).map(i => i.n || i.name || '').join(' · ');
  const disc = j.discounts ? Object.values(j.discounts).reduce((a,b) => a+b, 0) : 0;
  const cardColor = j.cardColor || '';
  const borderStyle = cardColor ? 'border-left:4px solid ' + cardColor + ';' : '';
  const isExpanded = expandedState[j.id] || false;

  // 색상 선택 버튼
  const colorPicker = '<div class="color-picker boss-only">'
    + COLOR_PALETTE.map(p =>
        '<div class="color-dot ' + (j.cardColor===p.color?'selected':'') + '"'
        + ' style="background:' + (p.color||'var(--card3)') + ';"'
        + ' onclick="setCardColor(\'' + j.id + '\',\'' + p.color + '\')" title="' + p.label + '"></div>'
      ).join('')
    + '</div>';

  // 매출/원가/마진
  let revHTML = '';
  if (hasJob && isBoss) {
    revHTML = '<div class="rev-box"><div class="rev-lbl">매출</div><div class="rev-val">' + j.revenue.toFixed(1) + '만</div></div>';
    revHTML += '<div class="cost-row">'
      + '<div class="cost-item"><div class="cost-lbl">원가</div><div class="cost-val c">' + j.cost.toFixed(1) + '만</div></div>'
      + '<div class="cost-item"><div class="cost-lbl">마진</div><div class="cost-val m">' + j.margin.toFixed(1) + '만</div></div>'
      + '</div>';
  }

  // 버튼
  let btns = '';
  if (isDone) {
    btns = `
      <div class="jbtns g2">
        <button class="jb billing" onclick="openSms('${j.id}')">📋 비용 안내</button>
        <button class="jb undo write-only" onclick="setStatus('${j.id}','sched')">↩ 되돌리기</button>
      </div>
      <div class="paid-row write-only" id="paid1_${j.id}" onclick="paidStep1('${j.id}')" style="display:${isPaid?'none':'flex'}">
        <div class="paid-box">✓</div>
        <span class="paid-lbl">💰 입금 확인하기 (1차)</span>
      </div>
      <div class="paid-row write-only" id="paid2_${j.id}" onclick="paidStep2('${j.id}')" style="display:none;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.3)">
        <div class="paid-box" style="border-color:var(--yellow)">✓</div>
        <span class="paid-lbl" style="color:var(--yellow)">💛 한번 더! 입금 완료?</span>
      </div>
      <div class="paid-row" id="paid3_${j.id}" style="display:${isPaid?'flex':'none'};background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.3)">
        <div class="paid-box on">✓</div>
        <span class="paid-lbl" style="color:var(--accent)">✅ 입금 완료</span>
        <button class="write-only" onclick="undoPaid('${j.id}')" style="background:none;border:none;color:var(--text3);font-size:11px;margin-left:auto;cursor:pointer">취소</button>
      </div>`;
  } else {
    btns = `
      <div class="jbtns g3">
        <button class="jb complete write-only" onclick="setStatus('${j.id}','done')">✅ 완료</button>
        <button class="jb call" onclick="doCall('${j.id}')">📞</button>
        <button class="jb msg" onclick="doSms('${j.id}')">💬</button>
      </div>`;
  }

  return `<div class="jcard ${cardCls}" id="card_${j.id}" style="${borderStyle}">
    <!-- 미니뷰: 전체 영역 탭 = 접기/펼치기, 제목 텍스트만 탭 = 시공입력 -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;cursor:pointer" onclick="toggleExpand('${j.id}')">
      <div style="flex:1;min-width:0">
        <!-- 제목: inline-block으로 텍스트 영역만 클릭 -->
        <span class="jcard-mini-title"
          style="color:${isDone?'var(--text)':cardColor||'var(--accent)'};display:inline;cursor:pointer"
          onclick="event.stopPropagation();openEdit('${j.id}')">${j.title}</span>
        <!-- 시간/상태 행 -->
        <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
          ${j.time ? `<span style="font-size:11px;color:var(--text2)">🕐 ${j.time}</span>` : ''}
          <span class="jstatus ${statusCls}" style="margin:0;padding:2px 6px">${statusIcon}</span>
          <span class="jcard-mini-dong" onclick="event.stopPropagation()">
            ${j.dong || ''}
          </span>
        </div>
      </div>
      <button class="boss-only" onclick="event.stopPropagation();delItem('${j.id}')" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0">✕</button>
    </div>

    <!-- 펼침 내용 -->
    <div class="jcard-body ${isExpanded?'expanded':'collapsed'}" id="body_${j.id}">
      <div style="height:8px"></div>
      ${colorPicker}
      ${revHTML}
      ${itemsTxt ? `<div class="jitems">${itemsTxt}${disc>0?' · 할인-'+disc+'만':''}</div>` : ''}
      ${j.memo ? `<textarea class="jmemo-edit" rows="3" onblur="saveOrigMemo('${j.id}',this.value)">${j.memo}</textarea>` : ''}
      <textarea class="jmemo" placeholder="추가 메모..." onblur="saveUserMemo('${j.id}', this.value)">${(j.userMemo&&j.userMemo!==j.memo)?j.userMemo:''}</textarea>
      ${btns}
    </div>
  </div>`;
}


// 펼침 상태 - 로컬 메모리에서만 관리 (Firebase 동기화 안 함)
const expandedState = {};

function toggleExpand(id) {
  const body = document.getElementById('body_' + id);
  if (!body) return;
  const isExp = body.classList.contains('expanded');

  // 아코디언: 다른 것 모두 접기
  Object.keys(expandedState).forEach(eid => {
    if (eid === id) return;
    const b = document.getElementById('body_' + eid);
    if (b && b.classList.contains('expanded')) {
      b.classList.remove('expanded');
      b.classList.add('collapsed');
      expandedState[eid] = false;
    }
  });

  // 현재 토글
  body.classList.toggle('expanded', !isExp);
  body.classList.toggle('collapsed', isExp);
  expandedState[id] = !isExp;
  // saveJobs() 호출 안 함 - 펼침상태는 동기화 안 함
}

function setCardColor(id, color) {
  if (!isBoss) { showToast('관리자만 색상을 변경할 수 있어요'); return; }
  if (!jobs[id]) jobs[id] = { id, status: 'sched' };
  jobs[id].cardColor = color;
  saveJobs();
  renderDay();
  updateSum();
}

function saveOrigMemo(id, val) {
  if (!jobs[id]) jobs[id] = { id, status: 'sched' };
  jobs[id].memo = val;
  saveJobs();
}

function setStatus(id, status) {
  if (!isBoss) { showToast('관리자만 변경할 수 있어요'); return; }
  if (!jobs[id]) jobs[id] = { id, status: 'sched' };
  jobs[id].status = status;
  if (status === 'sched') jobs[id].paid = false;
  saveJobs(); renderDay(); updateSum();
}

function togglePaid(id) {
  // 하위 호환용 (미사용)
}
function paidStep1(id) {
  if (!isBoss) { showToast('관리자만 입금 처리할 수 있어요'); return; }
  // 1차 클릭 - 2차 확인란 보이기
  const el1 = document.getElementById('paid1_'+id);
  const el2 = document.getElementById('paid2_'+id);
  if (el1) el1.style.display = 'none';
  if (el2) el2.style.display = 'flex';
}
function paidStep2(id) {
  // 2차 클릭 - 최종 입금완료
  if (!jobs[id]) jobs[id] = { id, status: 'done' };
  jobs[id].paid = true;
  jobs[id].status = 'paid';
  saveJobs(); renderDay(); updateSum();
  showToast('입금 완료 처리됐어요! 💳');
}
function undoPaid(id) {
  if (!jobs[id]) return;
  jobs[id].paid = false;
  jobs[id].status = 'done';
  saveJobs(); renderDay(); updateSum();
}

function saveDong(id, val) {
  if (!isBoss) return;
  if (!jobs[id]) jobs[id] = { id, status: 'sched' };
  jobs[id].dong = val.trim();
  saveJobs(); renderDay();
}

function saveUserMemo(id, val) {
  if (!isBoss) return; // 일반뷰 메모 저장 불가
  if (!jobs[id]) jobs[id] = { id, status: 'sched' };
  jobs[id].userMemo = val;
  saveJobs();
}

function delItem(id) {
  if (!isBoss) { showToast('관리자만 삭제할 수 있어요'); return; }
  if (!confirm('정말 삭제할까요?')) return;
  if (!confirm('한번 더 확인! 삭제하면 휴지통에서 복원 가능해요. 삭제할까요?')) return;
  
  // 휴지통에 보관 (30일)
  const all = getAllItems();
  const j = all.find(x => x.id === id);
  if (j) {
    const trash = JSON.parse(localStorage.getItem('tvlab_trash') || '[]');
    trash.push({
      ...j,
      deletedAt: new Date().toISOString(),
      deletedDate: curDate,
    });
    // 30일 지난 것 제거
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 30);
    const filtered = trash.filter(t => new Date(t.deletedAt) > cutoff);
    localStorage.setItem('tvlab_trash', JSON.stringify(filtered));
    if (db) saveFB('_trash', { items: filtered });
  }

  if (id.startsWith('b_')) {
    if (!jobs[id]) jobs[id] = { id };
    jobs[id].deleted = true;
  } else {
    delete jobs[id];
  }
  saveJobs(); renderDay(); updateSum();
  showToast('삭제됐어요. 휴지통에서 복원 가능해요 🗑️');
}

function doCall(id) {
  const all = getAllItems();
  const j = all.find(x => x.id === id);
  const ph = (j?.phone || '').replace(/[^0-9]/g, '');
  if (!ph) { alert('전화번호가 없어요'); return; }
  const a = document.createElement('a');
  a.href = 'tel:' + ph;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function doSms(id) {
  const all = getAllItems();
  const j = all.find(x => x.id === id);
  const ph = (j?.phone || '').replace(/[^0-9]/g, '');
  if (!ph) { alert('전화번호가 없어요'); return; }
  const a = document.createElement('a');
  a.href = 'sms:' + ph;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function updateSum() {
  const done = getAllItems().filter(j => (j.status==='done'||j.status==='paid') && j.revenue > 0);
  const rev = done.reduce((s,j) => s+j.revenue, 0);
  const cost = done.reduce((s,j) => s+j.cost, 0);
  const mgn = done.reduce((s,j) => s+j.margin, 0);
  const rate = rev > 0 ? Math.round(mgn/rev*100) : 0;
  document.getElementById('sRev').textContent = rev.toFixed(1);
  document.getElementById('sCost').textContent = cost.toFixed(1);
  document.getElementById('sMgn').textContent = mgn.toFixed(1);
  document.getElementById('sRate').textContent = rate + '%';
  document.getElementById('rateFill').style.width = Math.min(rate, 100) + '%';
}

// ════════════════════════════════════════════
// 월별 캘린더
// ════════════════════════════════════════════
function renderCal() {
  if (!calY) { const t = new Date(); calY = t.getFullYear(); calM = t.getMonth(); }
  const y = calY, m = calM;
  document.getElementById('calTitle').textContent = `${y}년 ${m+1}월`;
  const dows = ['일','월','화','수','목','금','토'];
  document.getElementById('calDow').innerHTML = dows.map((d,i) =>
    `<div class="cal-dow" style="${i===0?'color:var(--red)':i===6?'color:var(--accent)':''}">${d}</div>`).join('');
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const dim = new Date(y, m+1, 0).getDate();
  const todayStr = fmtDate(new Date());
  let cells = '';
  const prev = new Date(y, m, 0).getDate();
  for (let i = startDow-1; i >= 0; i--)
    cells += calCell(fmtDate(new Date(y,m-1,prev-i)), prev-i, true, false, false);
  for (let i = 1; i <= dim; i++) {
    const ds = fmtDate(new Date(y, m, i));
    cells += calCell(ds, i, false, ds===todayStr, ds===curDate);
  }
  const rem = (7-(startDow+dim)%7)%7;
  for (let i = 1; i <= rem; i++)
    cells += calCell(fmtDate(new Date(y,m+1,i)), i, true, false, false);
  document.getElementById('calGrid').innerHTML = cells;
}

function calCell(ds, day, other, isToday, isSel) {
  const base = BASE[ds] || [];
  const uJ = getJobsForDate(ds);
  const allJ = [
    ...base.map((s,i) => {
      const sv = uJ['b_'+i] || {};
      return { ...s, id:'b_'+i,
        time: sv.time || s.time || '',
        dong: sv.dong !== undefined ? sv.dong : (s.dong||''),
        status: sv.status || 'sched',
        deleted: sv.deleted || false,
        revenue: sv.revenue || 0,
        cardColor: sv.cardColor || '',
      };
    }).filter(x=>!x.deleted),
    ...Object.values(uJ).filter(j => j.id && !j.id.startsWith('b_') && !j.deleted)
  ].sort((a,b) => (a.time||'') > (b.time||'') ? 1 : -1);
  const shown = allJ.slice(0, 3);
  const more = allJ.length - 3;
  let chips = shown.map(s => {
    const isDone = s.status==='done'||s.status==='paid';
    const color = s.cardColor || (isDone ? '#66bb6a' : '#80b0ff');
    const bg = isDone
      ? 'rgba(102,187,106,.25)'
      : s.cardColor
        ? s.cardColor + '33'
        : 'rgba(100,160,255,.2)';
    return `<div class="cal-chip" style="background:${bg};color:${color}">${(s.title||'').slice(0,7)}</div>`;
  }).join('');
  if (more > 0) chips += `<div class="cal-more">+${more}</div>`;
  // 매출 표시 제거
  const cls = ['cal-cell', other?'other':'', isToday&&!other?'today':'', isSel&&!other?'sel':'', allJ.length&&!other?'has':''].filter(Boolean).join(' ');
  return `<div class="${cls}" onclick="calClick('${ds}')">
    <div class="cal-dn">${day}</div>
    <div class="cal-chips">${chips}</div>
  </div>`;
}

function calClick(ds) {
  setDate(ds);
  setView('day');
}

function moveMonth(n) {
  calM += n;
  if (calM > 11) { calM = 0; calY++; }
  if (calM < 0) { calM = 11; calY--; }
  renderCal();
}

// 시공 추가/수정 모달

function openAdd() {
  if (!isBoss) { alert('대표 전용 기능이에요'); return; }
  editingId = null;
  selItems = {};
  document.getElementById('addTitle').textContent = '추가';
  document.getElementById('fName').value = '';
  document.getElementById('fDong').value = '';
  document.getElementById('fPhone').value = '';
  document.getElementById('fDate').value = curDate;
  document.getElementById('fTime').value = '09:00';
  document.getElementById('fMemo').value = '';
  document.getElementById('parsePreview').style.display = 'none';
  parsedData = {};
  ['dCoupon','dReview','dContract','dEtc'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  document.getElementById('selSec').style.display = 'none';
  document.getElementById('selList').innerHTML = '';
  document.querySelectorAll('.tslot').forEach(t => t.classList.remove('on'));
  // 대표 모드 - 저장버튼 보이기
  document.getElementById('mainSaveBtn').style.display = 'block';
  document.getElementById('dongSaveBtn').style.display = 'none';
  // 모든 입력 활성화
  setModalReadOnly(false);
  upPv();
  document.getElementById('fDongWrap').style.display = 'block';
  document.getElementById('jobSection').style.display = 'block';
  document.getElementById('ovAdd').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function openEdit(id) {
  const all = getAllItems();
  const j = all.find(x => x.id === id);
  if (!j) return;
  editingId = id;
  selItems = {};
  const readOnly = !isBoss;
  document.getElementById('addTitle').textContent = readOnly ? '시공 내역 (읽기전용)' : '시공 수정';
  document.getElementById('fName').value = j.title || '';
  document.getElementById('fDong').value = j.dong || '';
  document.getElementById('fPhone').value = j.phone || '';
  document.getElementById('fDate').value = curDate;
  document.getElementById('fTime').value = j.time || '09:00';
  document.getElementById('fMemo').value = j.userMemo || '';  // 원본메모는 별도 표시
  document.getElementById('dCoupon').value = j.discounts?.coupon || '';
  document.getElementById('dReview').value = j.discounts?.review || '';
  document.getElementById('dContract').value = j.discounts?.contract || '';
  document.getElementById('dEtc').value = j.discounts?.etc || '';
  // 기존 항목 복원
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  (j.items || []).forEach(it => {
    selItems[it.id] = { id: it.id, n: it.n || it.name, rev: it.revenue || it.rev || 0, cost: it.cost || 0 };
    const el = document.getElementById('chip_' + it.id);
    if (el) el.classList.add('on');
  });
  // group 칩 on 상태 업데이트
  setTimeout(() => updateGroupChipState && updateGroupChipState(), 50);
  document.querySelectorAll('.tslot').forEach(t => t.classList.toggle('on', t.dataset.t === j.time));
  // 읽기전용 설정
  setModalReadOnly(readOnly);
  document.getElementById('mainSaveBtn').style.display = readOnly ? 'none' : 'block';
  document.getElementById('dongSaveBtn').style.display = readOnly ? 'block' : 'none';
  document.getElementById('fDongWrap').style.display = 'block';
  document.getElementById('jobSection').style.display = 'block';
  upSelList(); upPv();
  document.getElementById('ovAdd').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function setModalReadOnly(readOnly) {
  // 동호수/전화번호/메모/시간은 항상 수정 가능
  const alwaysEditable = ['fDong', 'fPhone', 'fMemo', 'fTime'];
  document.querySelectorAll('#ovAdd input, #ovAdd textarea').forEach(el => {
    if (alwaysEditable.includes(el.id)) return;
    el.style.pointerEvents = readOnly ? 'none' : '';
    el.style.opacity = readOnly ? '.5' : '';
  });
  // 칩은 readOnly시 비활성화
  document.querySelectorAll('#ovAdd .chip').forEach(el => {
    el.style.pointerEvents = readOnly ? 'none' : '';
    el.style.opacity = readOnly ? '.5' : '';
  });
  // 시간 슬롯은 항상 클릭 가능 (div이므로 별도 처리)
  document.querySelectorAll('#ovAdd .tslot').forEach(el => {
    el.style.pointerEvents = '';
    el.style.opacity = '1';
    el.style.cursor = 'pointer';
  });
  // fTime input도 항상 활성화
  const fTime = document.getElementById('fTime');
  if (fTime) { fTime.style.pointerEvents = ''; fTime.style.opacity = '1'; }
}

function closeAdd() {
  document.getElementById('ovAdd').classList.remove('show');
  document.body.style.overflow = '';
  refreshIfNeeded();
}

function saveJob() {
  if (!isBoss) { showToast('관리자만 저장할 수 있어요'); return; }
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('제목을 입력해주세요'); return; }

  let rev = 0, cost = 0;
  const items = Object.values(selItems).map(it => {
    rev += it.rev; cost += it.cost;
    return { id: it.id, n: it.n, revenue: it.rev, cost: it.cost };
  });
  const getDisc = id => parseFloat(document.getElementById(id).value) || 0;
  const disc = getDisc('dCoupon') + getDisc('dReview') + getDisc('dContract') + getDisc('dEtc');
  const fr = Math.max(0, rev - disc);
  const targetDate = document.getElementById('fDate').value || curDate;
  const prev = jobs[editingId] || {};

  // 새 일정 객체
  const newJob = {
    title: name,
    dong: document.getElementById('fDong').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    time: document.getElementById('fTime').value,
    items,
    discounts: {
      coupon: getDisc('dCoupon'),
      review: getDisc('dReview'),
      contract: getDisc('dContract'),
      etc: getDisc('dEtc'),
    },
    revenue: fr, cost, margin: fr - cost,
    status: prev.status || 'sched',
    paid: prev.paid || false,
    userMemo: document.getElementById('fMemo').value,
  };

  if (targetDate !== curDate) {
    // ── 다른 날짜로 이동
    if (editingId) {
      // 원래 날짜에서 삭제
      if (editingId.startsWith('b_')) {
        if (!jobs[editingId]) jobs[editingId] = { id: editingId };
        jobs[editingId].deleted = true;
      } else {
        delete jobs[editingId];
      }
      saveJobs();
    }
    // 새 날짜에 저장
    const targetJobs = JSON.parse(localStorage.getItem('tvl_' + targetDate) || '{}');
    const newId = 'u' + Date.now();
    targetJobs[newId] = { id: newId, ...newJob };
    localStorage.setItem('tvl_' + targetDate, JSON.stringify(targetJobs));
    if (typeof saveFB === 'function') {
      saveFB(curDate, jobs);
      saveFB(targetDate, targetJobs);
    }
    renderDay(); updateSum(); closeAdd();
    showToast(targetDate + '로 이동됐어요! 📅');
  } else {
    // ── 같은 날짜 저장
    const jid = editingId || ('u' + Date.now());
    jobs[jid] = { id: jid, ...newJob };
    saveJobs(); renderDay(); updateSum(); closeAdd();
    showToast('저장됐어요! 😊');
  }
}


function saveDongOnly() {
  if (!isBoss) { showToast('관리자만 저장할 수 있어요'); return; }
  const id = editingId;
  if (!id) return;
  if (!jobs[id]) jobs[id] = { id, status: 'sched' };
  jobs[id].dong = document.getElementById('fDong').value.trim();
  jobs[id].phone = document.getElementById('fPhone').value.trim();
  jobs[id].userMemo = document.getElementById('fMemo').value;
  jobs[id].time = document.getElementById('fTime').value;
  const targetDate = document.getElementById('fDate').value || curDate;
  if (targetDate !== curDate) {
    // 날짜 이동
    const moved = { ...jobs[id] };
    if (id.startsWith('b_')) {
      jobs[id].deleted = true;
    } else {
      delete jobs[id];
    }
    saveJobs();
    const targetJobs = JSON.parse(localStorage.getItem('tvl_' + targetDate) || '{}');
    const newId = 'u' + Date.now();
    moved.id = newId;
    moved.status = moved.status || 'sched';
    targetJobs[newId] = moved;
    localStorage.setItem('tvl_' + targetDate, JSON.stringify(targetJobs));
    if (typeof saveFB === 'function') {
      saveFB(curDate, jobs);
      saveFB(targetDate, targetJobs);
    }
    renderDay(); updateSum(); closeAdd();
    showToast(`${targetDate}로 이동됐어요! 📅`);
    return;
  }
  saveJobs();
  renderDay();
  closeAdd();
  showToast('저장됐어요! 😊');
}

// 칩 / 선택 항목
// ════════════════════════════════════════════
function buildGrids() {
  const src = getActiveItems();
  buildGrid('gTV', src.tv || ITEMS.tv);
  buildGrid('gBR', src.br || ITEMS.br);
  buildGrid('gEX', src.ex || ITEMS.ex);
  buildGrid('gCK', src.ck || ITEMS.ck);
  buildGrid('gCN', src.cn || ITEMS.cn);
}

function buildGrid(id, items) {
  document.getElementById(id).innerHTML = items.map(it => `
    <div class="chip" id="chip_${it.id}" onclick="togChip('${it.id}')">
      <div style="font-size:11px;line-height:1.3">${it.n}</div>
      ${it.s ? `<div class="chip-sub" style="color:var(--text2)">${it.s}</div>` : ''}
      <div class="chip-sub boss-only" style="color:var(--text3)">원가${it.cost}만</div>
    </div>`).join('');
}

function togChip(id) {
  // group 칩인지 확인
  const src = getActiveItems();
  const groupChip = [...(src.tv||[]),...(src.br||[]),...(src.ex||[]),...(src.ck||[]),...(src.cn||[])].find(i => i.id === id);
  if (groupChip && groupChip.groupItems) {
    openGroupSelect(id, groupChip);
    return;
  }
  // 이미 선택된 아이템이면 해제
  if (selItems[id]) {
    delete selItems[id];
    const el = document.getElementById('chip_'+id);
    if (el) el.classList.remove('on');
    // 부모 그룹칩도 on 해제 확인
    updateGroupChipState();
    upSelList(); upPv();
  } else {
    const it = ALL_ITEMS.find(i => i.id === id);
    if (!it) return;
    if (it.colors && it.colors.length > 1) {
      openColorSelect(id, it);
    } else {
      selItems[id] = { id, n: it.n, rev: it.def, cost: it.cost };
      const el = document.getElementById('chip_'+id);
      if (el) el.classList.add('on');
      upSelList(); upPv();
    }
  }
}

function updateGroupChipState() {
  // group 칩의 on/off 상태 업데이트
  [...ITEMS.tv].filter(it => it.groupItems).forEach(grp => {
    const hasSelected = grp.groupItems.some(gi => selItems[gi.id]);
    const el = document.getElementById('chip_'+grp.id);
    if (el) el.classList.toggle('on', hasSelected);
  });
}

function openGroupSelect(groupId, groupChip) {
  // 이미 선택된 그룹 아이템이 있으면 해제
  if (groupChip.groupItems.some(gi => selItems[gi.id])) {
    groupChip.groupItems.forEach(gi => {
      delete selItems[gi.id];
    });
    const el = document.getElementById('chip_'+groupId);
    if (el) el.classList.remove('on');
    upSelList(); upPv();
    return;
  }

  const existing = document.getElementById('groupSelectPop');
  if (existing) existing.remove();

  const pop = document.createElement('div');
  pop.id = 'groupSelectPop';
  pop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';

  const btnHtml = groupChip.groupItems.map(gi =>
    '<button data-gid="'+groupId+'" data-id="'+gi.id+'" data-n="'+gi.n+'" data-rev="'+gi.def+'" data-cost="'+gi.cost+'" class="gsel-btn"'
    + ' style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:13px 14px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px;text-align:left;display:flex;justify-content:space-between">'
    + '<span>'+gi.n+'</span><span style="color:var(--accent);font-weight:700">'+gi.s+'</span>'
    + '</button>'
  ).join('');

  pop.innerHTML = '<div style="background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:320px;border:1px solid var(--border)">'
    + '<div style="font-size:15px;font-weight:700;color:var(--accent);margin-bottom:14px">📺 '+groupChip.n+' 선택</div>'
    + btnHtml
    + '<button id="gsel-cancel" style="width:100%;background:none;border:none;color:var(--text2);padding:10px;font-size:13px;font-family:inherit;cursor:pointer">취소</button>'
    + '</div>';

  document.body.appendChild(pop);
  setTimeout(() => {
    document.querySelectorAll('.gsel-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const n = btn.dataset.n;
        const rev = parseFloat(btn.dataset.rev);
        const cost = parseFloat(btn.dataset.cost);
        const gid = btn.dataset.gid;
        selItems[id] = { id, n, rev, cost };
        // 그룹 칩 on
        const el = document.getElementById('chip_'+gid);
        if (el) {
          el.classList.add('on');
          const sub = el.querySelector('.chip-sub');
          if (sub) sub.textContent = n + ' ' + btn.querySelector('span:last-child').textContent;
        }
        pop.remove();
        upSelList(); upPv();
      });
    });
    const cancel = document.getElementById('gsel-cancel');
    if (cancel) cancel.addEventListener('click', () => pop.remove());
  }, 0);
}

function openColorSelect(id, it) {
  const existing = document.getElementById('colorSelectPop');
  if (existing) existing.remove();

  const pop = document.createElement('div');
  pop.id = 'colorSelectPop';
  pop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  const btnHtml = it.colors.map(col => {
    return '<button data-id="'+id+'" data-col="'+col+'" class="csel-btn"'
      + ' style="width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;margin-bottom:8px;text-align:left">'
      + '● ' + col + '</button>';
  }).join('');
  pop.innerHTML = '<div style="background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:320px;border:1px solid var(--border)">'
    + '<div style="font-size:15px;font-weight:700;color:var(--accent);margin-bottom:14px">🎨 ' + it.n + ' 색상 선택</div>'
    + btnHtml
    + '<button id="csel-cancel" style="width:100%;background:none;border:none;color:var(--text2);padding:10px;font-size:13px;font-family:inherit;cursor:pointer">취소</button>'
    + '</div>';
  // 이벤트 바인딩
  pop.querySelectorAll && setTimeout(() => {
    document.querySelectorAll('.csel-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectColorItem(btn.dataset.id, btn.dataset.col);
        pop.remove();
      });
    });
    const cancelBtn = document.getElementById('csel-cancel');
    if (cancelBtn) cancelBtn.addEventListener('click', () => pop.remove());
  }, 0);
  document.body.appendChild(pop);
}

function selectColorItem(id, color) {
  const it = ALL_ITEMS.find(i => i.id === id);
  if (!it) return;
  selItems[id] = { id, n: it.n + ' (' + color + ')', rev: it.def, cost: it.cost };
  const el = document.getElementById('chip_'+id);
  if (el) {
    el.classList.add('on');
    // 선택된 색상 표시
    const sub = el.querySelector('.chip-sub');
    if (sub) sub.textContent = color + ' 선택됨';
  }
  upSelList(); upPv();
}

function upSelList() {
  const keys = Object.keys(selItems);
  const sec = document.getElementById('selSec');
  const list = document.getElementById('selList');
  if (!keys.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.innerHTML = keys.map(id => {
    const it = selItems[id];
    return `<div class="sel-row">
      <span class="sel-name">${it.n}</span>
      <input type="number" class="sel-inp" value="${it.rev}" onchange="updSelRev('${id}',this.value)">
      <span class="sel-unit">만원</span>
      <button class="sel-del" onclick="removeSelItem('${id}')">✕</button>
    </div>`;
  }).join('');
}

function updSelRev(id, val) {
  if (selItems[id]) selItems[id].rev = parseFloat(val) || 0;
  upPv();
}

function removeSelItem(id) {
  delete selItems[id];
  const el = document.getElementById('chip_'+id);
  if (el) el.classList.remove('on');
  upSelList(); upPv();
}

function upPv() {
  let rev = 0, cost = 0;
  Object.values(selItems).forEach(it => { rev += it.rev; cost += it.cost; });
  const disc = ['dCoupon','dReview','dContract','dEtc'].reduce((s,id) => s+(parseFloat(document.getElementById(id).value)||0), 0);
  const fr = Math.max(0, rev - disc);
  document.getElementById('pvRev').textContent = fr.toFixed(1) + '만원';
  document.getElementById('pvCost').textContent = cost.toFixed(1) + '만원';
  document.getElementById('pvMgn').textContent = (fr-cost).toFixed(1) + '만원';
  document.getElementById('pvRevStaff').textContent = fr.toFixed(1) + '만원';
  document.getElementById('pvStaffRow').style.display = isBoss ? 'none' : 'flex';
}

// ════════════════════════════════════════════
function doSearch(q) {
  q = q.trim();
  const res = document.getElementById('searchRes');
  if (!q) { if(res) res.style.display = 'none'; return; }
  const qc = q.toLowerCase().replace(/[-\s]/g, '');
  const results = [];
  Object.entries(BASE).forEach(([ds, items]) => {
    const uJ = getJobsForDate(ds);
    items.forEach((s, i) => {
      const sv = uJ['b_'+i] || {};
      if (sv.deleted) return;
      const ph = (sv.phone||s.phone||'').replace(/[^0-9]/g,'');
      const title = (s.title||'').toLowerCase();
      const dong = (sv.dong!==undefined ? sv.dong : s.dong||'').toLowerCase();
      const memo = (s.memo||'').toLowerCase();
      if (ph.includes(qc)||title.includes(q.toLowerCase())||dong.includes(q.toLowerCase())||memo.includes(q.toLowerCase())) {
        results.push({ ds, title:s.title, dong:sv.dong!==undefined?sv.dong:s.dong||'', time:s.time, phone:sv.phone||s.phone||'', status:sv.status||'sched' });
      }
    });
  });
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key.startsWith('tvl_')) continue;
    const ds = key.replace('tvl_','');
    Object.values(JSON.parse(localStorage.getItem(key)||'{}')).filter(j=>j.id&&!j.id.startsWith('b_')&&!j.deleted).forEach(j => {
      const ph = (j.phone||'').replace(/[^0-9]/g,'');
      if (ph.includes(qc)||(j.title||'').toLowerCase().includes(q.toLowerCase())||(j.dong||'').toLowerCase().includes(q.toLowerCase())) {
        results.push({ ds, title:j.title, dong:j.dong||'', time:j.time||'', phone:j.phone||'', status:j.status||'sched' });
      }
    });
  }
  res.style.display = 'block';
  document.getElementById('searchHd').textContent = `검색 결과 ${results.length}건`;
  if (!results.length) { document.getElementById('searchList').innerHTML = '<div class="empty" style="padding:20px"><div class="empty-icon">🔍</div>결과가 없어요</div>'; return; }
  document.getElementById('searchList').innerHTML = results.map(r => {
    const d = new Date(r.ds+'T00:00:00');
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${r.time||''}`;
    const dongTxt = r.dong ? ` (${r.dong})` : '';
    const stIcon = r.status==='done'||r.status==='paid'?'✅':'📅';
    return `<div class="jcard" style="margin-bottom:8px;cursor:pointer" onclick="calClick('${r.ds}')">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:12px;font-weight:700;color:var(--yellow)">${dateStr}</span>
        <span>${stIcon}</span>
      </div>
      <div style="font-size:13px;font-weight:700">${r.title}${dongTxt}</div>
      ${r.phone?`<div style="font-size:11px;color:var(--text2);margin-top:3px">📞 ${r.phone}</div>`:''}
    </div>`;
  }).join('');
}

function clearSearch() {
  const inp = document.getElementById('searchInp');
  if (inp) inp.value = '';
  const hinp = document.getElementById('hdrSearchInp');
  if (hinp) hinp.value = '';
  doSearch('');

function openTrash() {
  const trash = JSON.parse(localStorage.getItem('tvlab_trash') || '[]');
  const list = document.getElementById('trashList');
  if (!trash.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🗑️</div>휴지통이 비어있어요</div>';
  } else {
    // 최신순 정렬
    const sorted = [...trash].sort((a,b) => new Date(b.deletedAt) - new Date(a.deletedAt));
    list.innerHTML = sorted.map((t, i) => {
      const d = new Date(t.deletedAt);
      const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
      const dongTxt = t.dong ? ` (${t.dong})` : '';
      return `<div class="jcard" style="margin-bottom:8px">
        <div style="font-size:10px;color:var(--text3);margin-bottom:4px">삭제일시: ${dateStr} · 날짜: ${t.deletedDate||''}</div>
        <div style="font-size:13px;font-weight:700;margin-bottom:6px">${t.title}${dongTxt}</div>
        ${t.time ? `<div style="font-size:11px;color:var(--text2)">🕐 ${t.time}</div>` : ''}
        <button onclick="restoreTrash(${i})" style="width:100%;margin-top:8px;background:linear-gradient(135deg,var(--green),#00aa55);color:#000;border:none;padding:9px;border-radius:8px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">↩ 복원하기</button>
      </div>`;
    }).join('');
  }
  document.getElementById('ovTrash').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function restoreTrash(idx) {
  const trash = JSON.parse(localStorage.getItem('tvlab_trash') || '[]');
  const sorted = [...trash].sort((a,b) => new Date(b.deletedAt) - new Date(a.deletedAt));
  const item = sorted[idx];
  if (!item) return;

  // 원래 날짜로 복원
  const targetDate = item.deletedDate || curDate;
  const targetJobs = JSON.parse(localStorage.getItem('tvl_' + targetDate) || '{}');
  
  // deleted 플래그 제거 후 복원
  const restored = { ...item };
  delete restored.deletedAt;
  delete restored.deletedDate;
  delete restored.deleted;
  restored.deleted = false;
  
  if (restored.id.startsWith('b_')) {
    targetJobs[restored.id] = { ...targetJobs[restored.id], deleted: false };
  } else {
    targetJobs[restored.id] = restored;
  }
  
  localStorage.setItem('tvl_' + targetDate, JSON.stringify(targetJobs));
  if (db) saveFB(targetDate, targetJobs);
  
  // 휴지통에서 제거
  const originalIdx = trash.indexOf(item);
  if (originalIdx > -1) trash.splice(originalIdx, 1);
  localStorage.setItem('tvlab_trash', JSON.stringify(trash));
  
  // 현재 날짜면 바로 반영
  if (targetDate === curDate) {
    jobs = targetJobs;
    renderDay(); updateSum();
  }
  
  closeTrash();
  showToast(`복원됐어요! (${targetDate}) 😊`);
}

function closeTrash() {
  document.getElementById('ovTrash').classList.remove('show');
  document.body.style.overflow = '';
}

function detectInch(text) {
  // 동호수(○동 ○호) 제거 후 인치 감지
  const cleaned = text.replace(/\d+동\s*\d+호/g, '').replace(/\d+층/g,'');
  if (/100인치|98인치/.test(cleaned)) return '98';
  if (/8[3-9]인치|80인치대/.test(cleaned)) return '80';
  if (/7[0-9]인치|70인치대/.test(cleaned)) return '70';
  if (/6[0-5]인치|65이하|60이하/.test(cleaned)) return '60';
  // 단독 숫자 인치 (앞뒤가 인치 관련 문맥일 때만)
  if (/(?:^|\s)(100|98)(?:인치|\s|$)/.test(cleaned)) return '98';
  if (/(?:^|\s)(8[3-9]|80)(?:인치|\s|$)/.test(cleaned)) return '80';
  if (/(?:^|\s)(7[5-9]|77|75|70)(?:인치|\s|$)/.test(cleaned)) return '70';
  if (/(?:^|\s)(6[0-5]|65)(?:인치|\s|$)/.test(cleaned)) return '60';
  // 만원 앞에 붙은 숫자는 인치 아님 (ex: 40만원, 5만원)
  // 기본값
  return '80';
}

function detectInchShort(text) {
  const cleaned = text.replace(/\d+동\s*\d+호/g,'');
  if (/100인치|98인치/.test(cleaned)) return '98';
  if (/8[3-9]인치|80인치대/.test(cleaned)) return '80';
  if (/7[0-9]인치|70인치대/.test(cleaned)) return '70';
  if (/6[0-5]인치|65이하|60이하/.test(cleaned)) return '60';
  if (/(?:^|\s)(100|98)(?:인치|\s|$)/.test(cleaned)) return '98';
  if (/(?:^|\s)(8[3-9]|80)(?:인치|\s|$)/.test(cleaned)) return '80';
  if (/(?:^|\s)(7[5-9]|77|75|70)(?:인치|\s|$)/.test(cleaned)) return '70';
  if (/(?:^|\s)(6[0-5]|65)(?:인치|\s|$)/.test(cleaned)) return '60';
  return '';
}

function autoTitle(text) {
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);

  // 아파트명: 첫줄에서 동호수/전화번호 제거
  let aptName = (lines[0] || '')
    .replace(/01[0-9][-\s]?\d{3,4}[-\s]?\d{4}/g,'')
    .replace(/\d+동\s*\d+호/g,'')
    .trim();

  // 인치
  const inch = detectInchShort(text);
  const inchMap = {'98':'98','80':'85','70':'75','60':'65'};

  // 시공 키워드 감지
  const tags = [];
  for (const rule of TITLE_KEYWORDS) {
    if (rule.keys.some(k => text.includes(k))) {
      let tag = rule.tag;
      // 인치 붙이는 항목
      if (['특무','프무','라무','가벽특무','타공','가벽타','무재설치','선정리'].includes(tag) && inch) {
        tag = (inchMap[inch]||'') + tag;
      }
      tags.push(tag);
      if (tags.length >= 3) break; // 최대 3개
    }
  }

  if (!aptName && !tags.length) return '';
  return [aptName, tags.join('+')].filter(Boolean).join(' ');
}

function parseMemo(text) {
  if (!text.trim()) {
    document.getElementById('parsePreview').style.display = 'none';
    return;
  }

  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  parsedData = {};

  // 전화번호
  const phoneRegex = /01[0-9][-\s]?\d{3,4}[-\s]?\d{4}/;
  for (const line of lines) {
    const m = line.match(phoneRegex);
    if (m) { parsedData.phone = m[0].replace(/[\s]/g,''); break; }
  }

  // 동호수
  const dongRegex = /\d+동\s*\d+호/;
  for (const line of lines) {
    const m = line.match(dongRegex);
    if (m) { parsedData.dong = m[0].replace(/\s+/g,' ').trim(); break; }
  }

  // 제목 자동 생성 (입력란 비어있을 때만)
  const curName = document.getElementById('fName').value.trim();
  if (!curName) {
    parsedData.title = autoTitle(text);
  }

  // 미리보기
  const rows = [];
  if (parsedData.title) rows.push('📌 제목: <b>'+parsedData.title+'</b>');
  if (parsedData.dong)  rows.push('🏠 동호수: <b>'+parsedData.dong+'</b>');
  if (parsedData.phone) rows.push('📞 전화번호: <b>'+parsedData.phone+'</b>');

  if (rows.length) {
    document.getElementById('parseResult').innerHTML = rows.join('<br>');
    document.getElementById('parsePreview').style.display = 'block';
  } else {
    document.getElementById('parsePreview').style.display = 'none';
  }
}


function applyParsed() {
  if (parsedData.title && !document.getElementById('fName').value.trim())
    document.getElementById('fName').value = parsedData.title;
  if (parsedData.dong)  document.getElementById('fDong').value = parsedData.dong;
  if (parsedData.phone) document.getElementById('fPhone').value = parsedData.phone;
  document.getElementById('parsePreview').style.display = 'none';
  showToast('자동 입력됐어요! ✨');
}

// 커스텀 아이템 (Firebase or localStorage)
let customItems = null; // null = 기본값 사용

const CATEGORY_NAMES = {
  tv: '📺 TV 시공방식',
  br: '📐 브라켓',
  ex: '🔊 추가기기',
  ck: '🕐 시계',
  cn: '🔌 콘센트',
};

function getActiveItems() {
  // customItems가 있으면 그걸 사용, 없으면 기본 ITEMS
  if (customItems) return customItems;
  return ITEMS;
}

async function loadCustomItems() {
  // Firebase에서 커스텀 아이템 로드
  try {
    if (db) {
      const doc = await db.collection('settings').doc('items').get();
      if (doc.exists) {
        customItems = doc.data().items;
        // ALL_ITEMS 재구성
        rebuildAllItems();
        return;
      }
    }
  } catch(e) {}
  // localStorage 체크
  const local = localStorage.getItem('tvlab_custom_items');
  if (local) {
    customItems = JSON.parse(local);
    rebuildAllItems();
  }
}

function rebuildAllItems() {
  const src = getActiveItems();
  // ALL_ITEMS 재구성
  ALL_ITEMS = [];
  ['tv','br','ex','ck','cn'].forEach(cat => {
    (src[cat] || []).forEach(it => {
      if (it.groupItems) {
        it.groupItems.forEach(gi => ALL_ITEMS.push({...gi}));
      } else {
        ALL_ITEMS.push({...it});
      }
    });
  });
  // 그리드 재구성 (커스텀 아이템 반영)
  buildGrids();
}

function toggleSettings() {
  const wrap = document.getElementById('settingsWrap');
  const isShow = wrap.classList.contains('show');
  if (isShow) {
    wrap.classList.remove('show');
    wrap.style.display = 'none';
  } else {
    // 다른 뷰 숨기기
    document.getElementById('viewDay').style.display = 'none';
    document.getElementById('viewMonth').style.display = 'none';
    document.getElementById('sumArea').style.display = 'none';
    wrap.classList.add('show');
    renderSettingsBody();
  }
}

function renderSettingsBody() {
  const src = customItems ? customItems : ITEMS;
  const body = document.getElementById('settingsBody');
  let html = '';

  ['tv','br','ex','ck','cn'].forEach(cat => {
    const items = src[cat] || [];
    html += `<div class="settings-section">
      <div class="settings-title">
        <span>${CATEGORY_NAMES[cat]}</span>
        <button onclick="addItem('${cat}')" style="background:var(--card2);border:1px solid var(--border);color:var(--accent);padding:4px 10px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer">＋ 추가</button>
      </div>`;

    items.forEach((it, idx) => {
      // group 아이템은 하위 아이템 표시
      if (it.groupItems) {
        html += `<div style="background:var(--card2);border-radius:10px;padding:8px;margin-bottom:6px">
          <div style="font-size:11px;color:var(--accent);font-weight:700;margin-bottom:6px">${it.n} (묶음)</div>`;
        it.groupItems.forEach((gi, gidx) => {
          html += itemRowHTML(cat, idx, gi, gidx);
        });
        html += `</div>`;
      } else {
        html += itemRowHTML(cat, idx, it, null);
      }
    });
    html += `</div>`;
  });

  body.innerHTML = html;
}

function itemRowHTML(cat, idx, it, gidx) {
  const dataAttr = gidx !== null
    ? `data-cat="${cat}" data-idx="${idx}" data-gidx="${gidx}"`
    : `data-cat="${cat}" data-idx="${idx}"`;
  return `<div class="item-row" ${dataAttr}>
    <input type="text" class="item-name-inp" value="${it.n}" placeholder="상품명"
      onchange="updateItem(this)">
    <div class="price-col">
      <input type="number" class="item-price-inp" value="${it.def}" placeholder="0"
        onchange="updateItem(this)" title="매출가(만원)">
      <div class="item-lbl">매출</div>
    </div>
    <div class="price-col">
      <input type="number" class="item-cost-inp" value="${it.cost}" placeholder="0"
        onchange="updateItem(this)" title="원가(만원)">
      <div class="item-lbl">원가</div>
    </div>
    <button class="item-del" onclick="deleteItem(this)" title="삭제">✕</button>
  </div>`;
}

function updateItem(el) {
  // 변경사항은 저장 버튼 누를 때 한꺼번에 처리
  // 미리보기만 업데이트
}

function addItem(cat) {
  if (!customItems) customItems = JSON.parse(JSON.stringify(ITEMS));
  const newItem = { id: 'custom_'+Date.now(), n: '새 상품', s: '', def: 0, cost: 0 };
  customItems[cat].push(newItem);
  renderSettingsBody();
}

function deleteItem(btn) {
  const row = btn.closest('.item-row');
  const cat = row.dataset.cat;
  const idx = parseInt(row.dataset.idx);
  const gidx = row.dataset.gidx;
  if (!confirm('삭제할까요?')) return;
  if (!customItems) customItems = JSON.parse(JSON.stringify(ITEMS));
  if (gidx !== undefined && gidx !== '') {
    customItems[cat][idx].groupItems.splice(parseInt(gidx), 1);
  } else {
    customItems[cat].splice(idx, 1);
  }
  renderSettingsBody();
}

function collectSettingsData() {
  if (!customItems) customItems = JSON.parse(JSON.stringify(ITEMS));
  const body = document.getElementById('settingsBody');
  const rows = body.querySelectorAll('.item-row[data-cat]');
  rows.forEach(row => {
    const cat = row.dataset.cat;
    const idx = parseInt(row.dataset.idx);
    const gidxRaw = row.dataset.gidx;
    const nameInp = row.querySelector('.item-name-inp');
    const priceInp = row.querySelector('.item-price-inp');
    const costInp = row.querySelector('.item-cost-inp');
    if (!nameInp || !customItems[cat]) return;
    let target;
    if (gidxRaw !== undefined && gidxRaw !== '' && customItems[cat][idx] && customItems[cat][idx].groupItems) {
      target = customItems[cat][idx].groupItems[parseInt(gidxRaw)];
    } else {
      target = customItems[cat][idx];
    }
    if (!target) return;
    target.n = nameInp.value.trim();
    target.def = parseFloat(priceInp.value) || 0;
    target.cost = parseFloat(costInp.value) || 0;
  });
}

async function saveSettings() {
  collectSettingsData();
  // localStorage 저장
  localStorage.setItem('tvlab_custom_items', JSON.stringify(customItems));
  // Firebase 저장
  try {
    if (db) await db.collection('settings').doc('items').set({ items: customItems });
  } catch(e) { console.warn('Firebase 저장 실패:', e); }
  rebuildAllItems();
  showToast('상품 설정 저장됐어요! 😊');
  toggleSettings();
  setView('day');
}

function resetSettings() {
  if (!confirm('기본값으로 리셋할까요? 모든 커스텀 설정이 사라져요.')) return;
  customItems = null;
  localStorage.removeItem('tvlab_custom_items');
  try {
    if (db) db.collection('settings').doc('items').delete();
  } catch(e) {}
  rebuildAllItems();
  showToast('기본값으로 리셋됐어요!');
  toggleSettings();
  setView('day');
}
